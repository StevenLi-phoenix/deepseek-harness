# fork cc-admin bundle — one feature's rows for the event profile, @deepseek-ai/cc-admin.
#
# A layer of the `event` profile, mounted right after @deepseek-ai/dsh-event-bundle (the service
# skeleton) and before the owner's profile patch. This layer mounts ctx.claudeCodeSessions for the
# console page: the service account's Claude Code sessions. It is mounted after the skeleton rows it
# depends on; see ../event/README.md for the mount order and for what the skeleton keeps.

- insert:
    # ctx.claudeCodeSessions: the service account's Claude Code sessions (list, start with a first task, stop) for the page
    # above. cc-bridge's tools live in the unattended preset mount, which nothing outside it can reach, so the page
    # goes through this root service; its defaults are the bridge's own.
    - id: cc-admin
      name: '@deepseek-ai/dsh-cc-admin'
