# XcodeGen spec for DSH Call. Generate the Xcode project with `xcodegen generate` in this directory.
name: DSHCall

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "16.0"

# Bundle identifier and signing team come from Config/Base.xcconfig, which includes the
# git-ignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 158.0.0

targets:
  DSHCall:
    type: application
    platform: iOS
    sources:
      - path: DSHCall
    dependencies:
      - package: WebRTC
    settings:
      base:
        INFOPLIST_FILE: DSHCall/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DSHCall/Resources/DSHCall.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - DSHCallTests
      gatherCoverageData: true
      coverageTargets:
        - DSHCall

  DSHCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSHCallTests
    dependencies:
      - target: DSHCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
