# Fork CI: the pull-request gates of ci.yml, run on every push to this fork's main.
# The fork commits straight to main, so ci.yml (pull_request only, on upstream's
# larger runners) never runs here, and CI master's push jobs wait for upstream's
# self-hosted pools. This file is fork-owned (packages/fork/UPSTREAM.md) and uses
# GitHub-hosted runners only. Runs never cancel each other: a run in progress
# finishes, and GitHub keeps only the newest pending push behind it.
name: Fork CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '^24.22.3'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_FAIL_FAST: '1'

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      # The archive gate compares against the previous main head, so it needs history.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # The static job seeds the pnpm store cache the other jobs restore.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.before }}
        run: pnpm run check:ci:static

  lint:
    name: typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Compile package declarations
        run: pnpm run typecheck

      - name: Run lint and duplication
        run: pnpm run check:ci:lint:contracts-ready

  # Four instrumented shards on 4-vCPU hosted runners stand in for ci.yml's two
  # 16-core shards; coverage-report merges them and owns the 100% thresholds.
  coverage:
    name: coverage ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DSH_COVERAGE_SHARD: ${{ matrix.shard }}/4
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Restore verified bubblewrap archive
        id: bubblewrap-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Save verified bubblewrap archive
        if: steps.bubblewrap-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      - name: Run coverage shard
        run: pnpm run check:ci:coverage-shard

      - name: Upload coverage shard blobs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-blobs-${{ matrix.shard }}
          path: coverage/shard/
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  coverage-report:
    name: coverage report
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage shard blobs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-blobs-*
          path: ${{ runner.temp }}/coverage-shards

      - name: Merge coverage shards and check thresholds
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run test:coverage:merge-shards "$RUNNER_TEMP/coverage-shards"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts and run the cheap readers
        run: pnpm run check:ci:build

  all-checks-passed:
    name: all checks passed
    if: ${{ !cancelled() }}
    needs: [static, lint, coverage-report, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a gate ended $result"; exit 1; }
          done
