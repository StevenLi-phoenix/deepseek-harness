# Deployment overlay for the event service: install as $DSH_HOME/cordis.patch.yml
# (/Users/dsh-runtime/.dsh/cordis.patch.yml, owned by dsh-runtime). The home patch
# outranks every other layer and the Web UI refuses to save any entry it sets, so it
# holds only deployment fixtures the UI does not edit. Model providers, the default
# model, and other settings live in the owner's profile patch, seeded from
# lsy/profiles/event/cordis.patch.yml and edited from the Web UI afterwards.

# Browser sign-in lasts a year instead of 30 days: the instance is reachable only on the
# tailnet, and the cookie signing secret survives restarts. A patch replaces the entry's
# whole config, so the bundle's trustedHosts line is restated.
- id: connection
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
    cookieMaxAgeDays: 365

# Models come from OpenRouter or other configured providers, so skip the official
# DeepSeek API-key onboarding dialog.
- id: ui-settings-models
  config:
    credentialOnboarding: false
