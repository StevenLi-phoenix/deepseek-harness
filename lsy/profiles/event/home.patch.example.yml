# Example $DSH_HOME/cordis.patch.yml for the event profile — routing layer
# (deployment-owned). Each `- id:` row replaces that row's whole config.
# Only subscriptions written here can start an actuator.

- id: lsy-telegram
  disabled: false
  config:
    chatId: '123456789'

- id: lsy-github-sensor
  config:
    notifications: true
    repos:
      - repo: deepseek-ai/deepseek-harness
        watch: [releases, tags]
      - repo: StevenLi-phoenix/deepseek-harness
        watch: [commits]
        branch: lsy/main

- id: lsy-event-bus
  config:
    webUrl: https://dsh-events.tailc2559b.ts.net/
    suppress:
      actors: []
      markers: ['Dsh-Agent:']
    subscriptions:
      - id: upstream-releases
        kinds: [github.release, github.tag]
        subjects: [deepseek-ai/deepseek-harness]
        action: notify
      - id: upstream-release-review
        kinds: [github.release]
        subjects: [deepseek-ai/deepseek-harness]
        action: session
        coalesceMs: 300000
        maxPerHour: 2
        session:
          workspacePath: /Users/dsh-runtime/work/deepseek-harness
          agentPreset: unattended
          permissionPreset: danger-full-access
          instructions: >-
            A new upstream DeepSeek Harness release is out. Read its notes and the diff
            since our fork's base tag (see packages/lsy/UPSTREAM.md), and tell me whether
            anything breaks packages/lsy or the event profile. Do not push anything.
      - id: notifications
        kinds: [github.notification.*]
        action: notify
        coalesceMs: 120000
        maxPerHour: 20
