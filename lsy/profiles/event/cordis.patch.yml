# lsy event profile — composition layer (code-owned).
#
# Mounts the Web composition plus the event-driven agent service. Deployment-owned
# routing (subscriptions, repositories, chat id) belongs in $DSH_HOME/cordis.patch.yml,
# which replaces these rows' config by id; see home.patch.example.yml.
#
# Secrets are read per use from the instance credential store or $DSH_HOME/.env:
#   DEEPSEEK_API_KEY, LSY_GITHUB_TOKEN, LSY_GITHUB_NOTIFICATIONS_TOKEN, LSY_TELEGRAM_BOT_TOKEN

# Remote-first: this instance is reached through a browser on another machine,
# so never launch applications on the host display.
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

- insert:
    # Runtime logs to stdout (launchd captures them). 2 = info, 3 = debug.
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        levels:
          default: 2

    # Session creation seam used by the bus for `session` subscriptions.
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: lsy-event-bus
      name: '@deepseek-ai/dsh-lsy-event-bus'
      config:
        subscriptions: []

    - id: lsy-github-sensor
      name: '@deepseek-ai/dsh-lsy-github-sensor'
      config:
        repos: []

    # Disabled until the home patch supplies a chat id.
    - id: lsy-telegram
      name: '@deepseek-ai/dsh-lsy-telegram'
      disabled: true
      config:
        chatId: unset

    # Unattended agent preset: `standard` minus interactive-only tools
    # (command-goal, tool-goal, planning, tool-ask-user, tool-plugin-manager, tool-plugin-market).
    - id: preset-unattended
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: unattended
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are an unattended agent powered by the {{model}} model, started by an event
                subscription on an always-on host. No human is watching this Session: never wait
                for input, finish the task in this turn, and end with a short answer suitable for a
                phone notification. Mark every commit or comment you create with the trailer
                `Dsh-Agent: <session title>` so your own changes do not trigger you again.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
