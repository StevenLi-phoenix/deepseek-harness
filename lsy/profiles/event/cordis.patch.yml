# lsy event profile — composition layer (code-owned).
#
# Mounts the Web composition plus the event-driven agent service. Nothing here needs editing
# per deployment: what to watch is created at run time by the agent itself (watch_create,
# schedule_create), and the owner reaches the agent over WeChat.
#
# Secrets are read per use from the instance credential store or $DSH_HOME/.env:
#   DEEPSEEK_API_KEY, LSY_GITHUB_TOKEN, LSY_GITHUB_NOTIFICATIONS_TOKEN (optional).
# The WeChat bot account is bound once with lsy/deploy/wechat-login.mjs and kept in
# $DSH_HOME/lsy-wechat/account.json.

# Remote-first: this instance is reached through a browser on another machine,
# so never launch applications on the host display.
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

- insert:
    # Runtime logs to stdout (launchd captures them). 2 = info, 3 = debug.
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        levels:
          default: 2

    # Session creation seam used by the bus for `session` subscriptions.
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    # Routing state (agent-created subscriptions and repository watches) lives in storage;
    # these rows only carry deployment-wide settings.
    - id: lsy-event-bus
      name: '@deepseek-ai/dsh-lsy-event-bus'
      config:
        webUrl: https://dsh-events.tailc2559b.ts.net/
        suppress:
          actors: []
          markers: ['Dsh-Agent:']

    - id: lsy-github-sensor
      name: '@deepseek-ai/dsh-lsy-github-sensor'

    # Owner channel: chat Session over WeChat and ctx.lsyNotifier for the bus.
    - id: lsy-wechat
      name: '@deepseek-ai/dsh-lsy-wechat'

    # Unattended agent preset: `standard` minus interactive-only tools (command-goal, tool-goal,
    # planning, tool-ask-user, tool-plugin-manager, tool-plugin-market), plus the watch tools.
    # Used by the WeChat chat Session and by Sessions that watches start.
    - id: preset-unattended
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: unattended
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the owner's always-on agent, powered by the {{model}} model, running on
                their Mac mini under the dedicated `dsh-runtime` account. A turn starts in one of
                three ways: the owner writes to you on WeChat, a watch you created fires, or a
                reminder you scheduled comes due. Nobody approves tool calls and nobody can answer
                questions mid-turn, so finish what you can in this turn. Your final answer is sent
                to the owner's WeChat as plain text: keep it short, use the owner's language, and
                avoid Markdown tables and headings. When a watch or reminder turn has nothing worth
                the owner's attention, answer exactly NO_REPLY and nothing is sent. Manage what you
                monitor with watch_create, watch_list, and watch_delete, and recurring time-based
                checks with schedule_create, then tell the owner what you set up. Mark every commit
                or comment you create with the trailer `Dsh-Agent: <session title>` so your own
                changes do not trigger you again.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: lsy-tool-watch
            name: '@deepseek-ai/dsh-lsy-tool-watch'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
